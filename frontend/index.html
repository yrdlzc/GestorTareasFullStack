<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="Sistema de Gestión de Tareas Full Stack">

    <title>
        Sistema de Gestión de Tareas
    </title>

    <link
        rel="stylesheet"
        href="./css/styles.css">

</head>

<body>

    <main class="contenedor-principal">

        <header class="encabezado">

            <h1>
                Sistema de Gestión de Tareas
            </h1>

            <p>
                Proyecto Full Stack con Node.js,
                Express.js y MongoDB.
            </p>

        </header>

        <section class="panel-bienvenida">

            <h2>
                Bienvenido
            </h2>

            <p>
                Aplicación para la gestión de tareas
                mediante operaciones CRUD y conexión
                con MongoDB.
            </p>

        </section>

        <section class="formulario-tareas">

            <h2>
                Nueva Tarea
            </h2>

            <form id="form-tarea">

                <div class="grupo-campo">

                    <label for="titulo">
                        Título
                    </label>

                    <input
                        type="text"
                        id="titulo"
                        name="titulo"
                        placeholder="Ingrese el título de la tarea">

                </div>

                <div class="grupo-campo">

                    <label for="descripcion">
                        Descripción
                    </label>

                    <textarea
                        id="descripcion"
                        name="descripcion"
                        rows="5"
                        placeholder="Ingrese una descripción detallada"></textarea>

                </div>

                <button
                    type="submit"
                    class="btn-principal">

                    Guardar Tarea

                </button>

            </form>

        </section>

        <section class="lista-tareas">

            <h2>
                Lista de Tareas
            </h2>

            <div id="contenedor-tareas">

                <p class="mensaje-carga">
                    No existen tareas registradas.
                </p>

            </div>

        </section>

    </main>

    <script src="./js/app.js"></script>

</body>

</html>
